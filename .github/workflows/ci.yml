name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static HTML: no TypeScript, lint or unit tests. `pnpm check` runs
  # `pnpm build` (`wrangler deploy --dry-run`), which validates wrangler.jsonc
  # and the assets directory without deploying, so run-build stays off.
  # `pnpm e2e` starts `wrangler dev` and runs the HTTP smoke (plain fetch).
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-e2e: true
